<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2E4057">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>키보드 자판 외우기 게임</title>
<style>
  @font-face {
    font-family: "D2Coding";
    src: url("fonts/D2Coding.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "D2Coding";
    src: url("fonts/D2Coding-Bold.ttf") format("truetype");
    font-weight: 800;
    font-style: normal;
  }
  :root {
    --board: #2E4057;
    --felt: #3C5A73;
    --card: #FDFBF3;
    --card-edge: #D9D2BC;
    --ink: #26313D;
    --pick: #F2A03D;
    --right: #45B27A;
    --wrong: #E05E5E;
    --hint: #F5D76E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--board);
    font-family: "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* ===== 패널(카드) ===== */
  .panel {
    width: 480px;
    max-width: 100%;
    background: var(--card);
    color: var(--ink);
    border-radius: 16px;
    box-shadow:
      0 3px 0 var(--card-edge),
      0 6px 12px rgba(0,0,0,.25);
    padding: 24px 16px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== 타이포그래피 ===== */
  .title {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 16px;
  }
  .guide-text {
    text-align: center;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .hint-badge {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 24px;
    background: var(--hint);
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    text-align: center;
  }
  .result-text {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px;
  }
  .result-sub {
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: #5a6472;
    margin: 0;
  }
  .score-num {
    font-size: 32px;
    font-weight: 800;
    font-family: "D2Coding", "Consolas", "Courier New", monospace;
  }

  /* ===== 시작 화면 ===== */
  .btn {
    display: block;
    width: 100%;
    height: 62px;
    font-size: 22px;
    font-weight: 800;
    line-height: 62px;
    padding: 0;
    margin-bottom: 12px;
    border: none;
    border-radius: 14px;
    background: var(--pick);
    color: var(--ink);
    box-shadow: 0 5px 0 rgba(0,0,0,.3);
    cursor: pointer;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,.3);
  }
  .btn .stars { opacity: .7; margin-left: 4px; }

  /* ===== 게임 화면 ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }
  .stat-label {
    font-size: 15px;
    font-weight: 500;
    color: #5a6472;
    margin-right: 6px;
  }

  .felt-slot {
    background: var(--felt);
    border: 2px dashed rgba(255,255,255,.35);
    border-radius: 12px;
    padding: 28px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.2);
  }
  .question-instruction {
    font-size: 15px;
    font-weight: 700;
    color: #eef1f5;
    margin: 0 0 16px;
  }
  .hero-card {
    background: var(--card);
    border: 3px solid transparent;
    border-radius: 12px;
    box-shadow:
      0 3px 0 var(--card-edge),
      0 6px 12px rgba(0,0,0,.25);
    padding: 12px 40px;
    min-width: 96px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question-char {
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
  }
  @keyframes cardPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes cardShake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    75%      { transform: translateX(8px); }
  }
  .hero-card.judge-right {
    border-color: var(--right);
    animation: cardPop .3s ease;
  }
  .hero-card.judge-wrong {
    border-color: var(--wrong);
    animation: cardShake .3s ease;
  }

  .feedback-box { min-height: 52px; visibility: hidden; }
  .feedback-box.show { visibility: visible; }
  .feedback-box.correct .result-text { color: var(--right); }
  .feedback-box.wrong .result-text { color: var(--wrong); }

  /* ===== 종료 화면 ===== */
  .end-title { margin-bottom: 16px; }
  .final-score-wrap {
    text-align: center;
    margin-bottom: 24px;
  }
  .final-score {
    font-size: 52px;
  }
</style>
</head>
<body>

<div class="panel">

  <!-- 시작 화면 -->
  <div id="screen-start" class="screen active">
    <p class="title">키보드 자판<br>외우기 게임</p>
    <p class="guide-text">화면에 나온 글자를<br>키보드에서 빨리 눌러보세요!</p>
    <span class="hint-badge">⌨️ 컴퓨터(노트북) 키보드로 하는 게임이에요</span>
    <button class="btn" data-level="easy">초급 <span class="stars">★</span></button>
    <button class="btn" data-level="normal">중급 <span class="stars">★★</span></button>
    <button class="btn" data-level="hard">고급 <span class="stars">★★★</span></button>
  </div>

  <!-- 게임 화면 -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <span><span class="stat-label">남은 시간</span><span class="score-num" id="time-left">60</span>초</span>
      <span><span class="stat-label">점수</span><span class="score-num" id="score">0</span></span>
    </div>
    <div class="felt-slot">
      <p class="question-instruction">이 글자를 눌러보세요</p>
      <div class="hero-card" id="hero-card">
        <div class="question-char" id="question-char">1</div>
      </div>
    </div>
    <div class="feedback-box" id="feedback-box">
      <p class="result-text" id="feedback-main"></p>
      <p class="result-sub" id="feedback-sub"></p>
    </div>
  </div>

  <!-- 종료 화면 -->
  <div id="screen-end" class="screen">
    <p class="result-text end-title">게임 종료! 수고했어요 🎉</p>
    <div class="final-score-wrap">
      <span class="score-num final-score" id="final-score">0점</span>
    </div>
    <button class="btn" id="restart-btn">다시 하기</button>
  </div>

</div>

<script>
(function () {
  // 두벌식 자판 기준: 물리 키(code) -> 각 모드별 글자
  var KEY_MAP = {
    Digit0: { num: '0' }, Digit1: { num: '1' }, Digit2: { num: '2' },
    Digit3: { num: '3' }, Digit4: { num: '4' }, Digit5: { num: '5' },
    Digit6: { num: '6' }, Digit7: { num: '7' }, Digit8: { num: '8' },
    Digit9: { num: '9' },
    KeyQ: { eng: 'q', kor: 'ㅂ' }, KeyW: { eng: 'w', kor: 'ㅈ' },
    KeyE: { eng: 'e', kor: 'ㄷ' }, KeyR: { eng: 'r', kor: 'ㄱ' },
    KeyT: { eng: 't', kor: 'ㅅ' }, KeyY: { eng: 'y', kor: 'ㅛ' },
    KeyU: { eng: 'u', kor: 'ㅕ' }, KeyI: { eng: 'i', kor: 'ㅑ' },
    KeyO: { eng: 'o', kor: 'ㅐ' }, KeyP: { eng: 'p', kor: 'ㅔ' },
    KeyA: { eng: 'a', kor: 'ㅁ' }, KeyS: { eng: 's', kor: 'ㄴ' },
    KeyD: { eng: 'd', kor: 'ㅇ' }, KeyF: { eng: 'f', kor: 'ㄹ' },
    KeyG: { eng: 'g', kor: 'ㅎ' }, KeyH: { eng: 'h', kor: 'ㅗ' },
    KeyJ: { eng: 'j', kor: 'ㅓ' }, KeyK: { eng: 'k', kor: 'ㅏ' },
    KeyL: { eng: 'l', kor: 'ㅣ' },
    KeyZ: { eng: 'z', kor: 'ㅋ' }, KeyX: { eng: 'x', kor: 'ㅌ' },
    KeyC: { eng: 'c', kor: 'ㅊ' }, KeyV: { eng: 'v', kor: 'ㅍ' },
    KeyB: { eng: 'b', kor: 'ㅠ' }, KeyN: { eng: 'n', kor: 'ㅜ' },
    KeyM: { eng: 'm', kor: 'ㅡ' },
    Minus: { sym: '-' }, Equal: { sym: '=' },
    BracketLeft: { sym: '[' }, BracketRight: { sym: ']' },
    Semicolon: { sym: ';' }, Quote: { sym: "'" },
    Comma: { sym: ',' }, Period: { sym: '.' }, Slash: { sym: '/' },
    Backslash: { sym: '\\' }, Backquote: { sym: '`' }
  };

  var LEVELS = {
    easy:   { modes: ['num', 'eng'],               fast: 1.5, normal: 3.0, gameTime: 60 },
    normal: { modes: ['num', 'eng', 'kor'],        fast: 1.2, normal: 2.5, gameTime: 60 },
    hard:   { modes: ['num', 'eng', 'kor', 'sym'], fast: 1.0, normal: 2.0, gameTime: 60 }
  };

  var screenStart = document.getElementById('screen-start');
  var screenGame = document.getElementById('screen-game');
  var screenEnd = document.getElementById('screen-end');
  var timeLeftEl = document.getElementById('time-left');
  var scoreEl = document.getElementById('score');
  var questionCharEl = document.getElementById('question-char');
  var heroCard = document.getElementById('hero-card');
  var feedbackBox = document.getElementById('feedback-box');
  var feedbackMain = document.getElementById('feedback-main');
  var feedbackSub = document.getElementById('feedback-sub');
  var finalScoreEl = document.getElementById('final-score');

  var pool = [];          // [{code, char}]
  var current = null;
  var score = 0;
  var timeLeft = 0;
  var gameTimerId = null;
  var questionStartAt = 0;
  var inputLocked = false;
  var level = null;

  function buildPool(levelConf) {
    var list = [];
    Object.keys(KEY_MAP).forEach(function (code) {
      levelConf.modes.forEach(function (mode) {
        if (KEY_MAP[code][mode]) {
          list.push({ code: code, char: KEY_MAP[code][mode] });
        }
      });
    });
    return list;
  }

  function showScreen(el) {
    [screenStart, screenGame, screenEnd].forEach(function (s) {
      s.classList.remove('active');
    });
    el.classList.add('active');
  }

  function nextQuestion() {
    current = pool[Math.floor(Math.random() * pool.length)];
    questionCharEl.textContent = current.char;
    heroCard.classList.remove('judge-right', 'judge-wrong');
    feedbackBox.className = 'feedback-box';
    feedbackMain.textContent = '';
    feedbackSub.textContent = '';
    questionStartAt = Date.now();
    inputLocked = false;
  }

  function updateScore(delta) {
    score = Math.max(0, score + delta);
    scoreEl.textContent = score;
  }

  function startGame(levelKey) {
    level = LEVELS[levelKey];
    pool = buildPool(level);
    score = 0;
    timeLeft = level.gameTime;
    scoreEl.textContent = score;
    timeLeftEl.textContent = timeLeft;
    showScreen(screenGame);
    nextQuestion();

    clearInterval(gameTimerId);
    gameTimerId = setInterval(function () {
      timeLeft -= 1;
      timeLeftEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    clearInterval(gameTimerId);
    finalScoreEl.textContent = score + '점';
    showScreen(screenEnd);
  }

  function handleAnswer(code) {
    if (inputLocked || !current) return;
    inputLocked = true;

    var elapsed = (Date.now() - questionStartAt) / 1000;
    var correct = code === current.code;

    heroCard.classList.remove('judge-right', 'judge-wrong');
    void heroCard.offsetWidth; // 애니메이션 재시작을 위한 리플로우

    if (correct) {
      var bonus = 0;
      if (elapsed < level.fast) bonus = 2;
      else if (elapsed < level.normal) bonus = 1;
      updateScore(1 + bonus);
      feedbackBox.className = 'feedback-box show correct';
      feedbackMain.textContent = '정답이에요! (◕‿◕)';
      feedbackSub.textContent = bonus > 0 ? '+' + (1 + bonus) + '점 (빠르게 눌렀어요!)' : '+1점';
      heroCard.classList.add('judge-right');
    } else {
      updateScore(-1);
      feedbackBox.className = 'feedback-box show wrong';
      feedbackMain.textContent = '앗, 틀렸어요! (>_<)';
      feedbackSub.textContent = '-1점, 다시 도전해봐요';
      heroCard.classList.add('judge-wrong');
    }

    setTimeout(function () {
      if (timeLeft > 0) nextQuestion();
    }, 500);
  }

  document.querySelectorAll('.btn[data-level]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      startGame(btn.getAttribute('data-level'));
    });
  });

  document.getElementById('restart-btn').addEventListener('click', function () {
    showScreen(screenStart);
  });

  window.addEventListener('keydown', function (e) {
    if (!screenGame.classList.contains('active')) return;
    if (!KEY_MAP[e.code]) return; // 관계없는 키(Shift, Enter 등)는 무시
    e.preventDefault();
    handleAnswer(e.code);
  });
})();
</script>

</body>
</html>
